name: Unity license activation file

# Run once manually (Actions tab -> this workflow -> Run workflow) to get the .alf file.
on:
  workflow_dispatch:

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: alf
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: auto
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.alf.outputs.filePath }}
          path: ${{ steps.alf.outputs.filePath }}
